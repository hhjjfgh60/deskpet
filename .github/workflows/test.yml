name: Build GPT Dragon Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install Pillow==11.3.0
      - name: Restore missing original assets and fetch pinned dragon atlas
        run: python scripts/prepare_assets.py
      - name: Verify real atlas pixels, metadata and source checksums
        run: python scripts/verify_assets.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Command-line Tools 16.0; the action installs sdkmanager itself.
          cmdline-tools-version: '12266719'
          # Override the action default (tools platform-tools): legacy tools is obsolete.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Verify installed Android SDK
        run: |
          sdkmanager --version
          adb version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug-signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Configure fixed signing from GitHub Secret
        if: github.event_name != 'pull_request'
        env:
          DESKPET_SIGNING_BUNDLE: ${{ secrets.DESKPET_SIGNING_BUNDLE }}
        run: python scripts/configure_signing.py
      - name: Rebuild APK with the verified fixed signing key
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Download the previously installed debug APK for comparison
        continue-on-error: true # The old artifact can expire; fixed certificate checks remain mandatory.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/hhjjfgh60/deskpet/actions/artifacts/12521013140/zip > "$RUNNER_TEMP/previous-apk.zip"
          unzip -p "$RUNNER_TEMP/previous-apk.zip" app-debug.apk > "$RUNNER_TEMP/previous-app-debug.apk"
      - name: Verify native pixels and fixed signer; report old-version migration
        if: github.event_name != 'pull_request'
        run: python scripts/verify_apk_clarity.py
      - name: Upload installable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gpt-dragon-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/clarity/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/deskpet-signing"
